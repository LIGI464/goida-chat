name: goida-chat

services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${API_URL:-http://api.localhost}
        VITE_LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit.localhost}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost}
      DATABASE_URL: ${DATABASE_URL:-postgresql://goida:change_me_database_password@postgres:5432/goida_chat?schema=public}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      COOKIE_SECRET: ${COOKIE_SECRET:-change_me_cookie_secret_at_least_32_chars}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change_me_auth_secret_at_least_32_chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://api.localhost}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit.localhost}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-change_me_livekit_secret_at_least_32_chars}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goida_chat}
      POSTGRES_USER: ${POSTGRES_USER:-goida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_database_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./services/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - '7881:7881/tcp'
      - '59000-59100:59000-59100/udp'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_SITE: ${APP_SITE:-http://localhost}
      API_SITE: ${API_SITE:-http://api.localhost}
      LIVEKIT_SITE: ${LIVEKIT_SITE:-http://livekit.localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - livekit

volumes:
  postgres_data:
  valkey_data:
  caddy_data:
  caddy_config:
